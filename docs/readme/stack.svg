<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <filter id="stackShadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#191816" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="20" fill="#F5F5F2"/>

  <!-- Col 1 -->
  <g transform="translate(24, 24)" filter="url(#stackShadow)">
    <rect width="270" height="172" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#B9492F">ИНТЕРФЕЙС</text>
    <text x="22" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#283132">React 19 + TypeScript</text>
    <text x="22" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Tailwind CSS 4 и CSS-токены</text>
    <text x="22" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Локальный шрифт Manrope</text>
    <text x="22" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Адаптивный шторка-лист / панель</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(318, 24)" filter="url(#stackShadow)">
    <rect width="270" height="172" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#B9492F">3D-КАРТА И ГЕОМЕТРИЯ</text>
    <text x="22" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#283132">MapLibre GL JS 6</text>
    <text x="22" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Проекция Globe → Mercator</text>
    <text x="22" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• 195 стран (Natural Earth 10m)</text>
    <text x="22" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Векторный стиль OpenFreeMap</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(612, 24)" filter="url(#stackShadow)">
    <rect width="270" height="172" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#B9492F">ПОИСК И ДАННЫЕ</text>
    <text x="22" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#283132">Nominatim + Storage v1</text>
    <text x="22" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Межвкладочный троттлинг 1 р/с</text>
    <text x="22" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Слияние конкурентных вкладок</text>
    <text x="22" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Резервный ключ при сбоях</text>
  </g>

  <!-- Col 4 -->
  <g transform="translate(906, 24)" filter="url(#stackShadow)">
    <rect width="270" height="172" rx="14" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#B9492F">СБОРКА И ТЕСТЫ</text>
    <text x="22" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#283132">Vite + Windows Setup</text>
    <text x="22" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Автономный установщик Setup.exe</text>
    <text x="22" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Фоновый хост + системный трей</text>
    <text x="22" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#5F6868">• Vitest + 78 E2E-проверок Playwright</text>
  </g>
</svg>
